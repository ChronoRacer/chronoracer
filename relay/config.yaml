server:
  host: 0.0.0.0
  port: 8080
  log_level: info
  config_file: relay/config.yaml
okta:
  issuer: https://example.okta.com/oauth2/default
  audience: api://default
  jwks_url: https://example.okta.com/oauth2/default/v1/keys
  algorithms: [RS256]
pubsub:
  build_finished_audience: ""
  export_done_audience: ""
service:
  heartbeat_freshness_seconds: 30

