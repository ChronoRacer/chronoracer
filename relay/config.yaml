# Any new field must be added to infra/always-on/relay-config.yaml.tftpl and secret reapplied
server:
  host: 0.0.0.0
  port: 8080
  log_level: info
okta:
  enabled: true
  issuer: https://chronoracer.eu.auth0.com/
  audience: https://api.chronoracer.com
gcp:
  enabled: true
  project_id: chronoracer
  firestore_database: "(default)"
  export_bucket: chronoracer-race
  cloud_build_trigger_id: efe837e7-e984-4b43-a01b-fcc72439969a
  cloud_build_location: europe-west1
  build_finished_audience: chronoracer-relay-build-finished
  build_finished_service_account: build-finished-push@chronoracer.iam.gserviceaccount.com
  export_done_audience: chronoracer-relay-export-done
  export_done_service_account: export-done-push@chronoracer.iam.gserviceaccount.com
  build_finished_topic: cloud-builds
  export_done_topic: export-done
  kafka_private_bootstrap: kafka.europe-west1-b.c.chronoracer.internal:9092
  kafka_control_topic: control
  kafka_heartbeat_topic: heartbeat
  kafka_event_topic: event
  kafka_public_port: 9094
service:
  heartbeat_freshness_seconds: 50
  build_bind_window_seconds: 600
