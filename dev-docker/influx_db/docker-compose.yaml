services:
  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3-core
    env_file:
      - influxdb3.env
    ports:
      - "8181:8181"
    volumes:
      - influxdb3_data:/var/lib/influxdb3
      - ./admin-token.json:/etc/influxdb3/admin-token.json:ro
    command: serve
    restart: unless-stopped

volumes:
  influxdb3_data: