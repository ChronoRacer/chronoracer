[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[feature_toggles]
enable = newInfluxDSConfigPageDesign

[auth]
disable_login_form = true
oauth_auto_login = true
disable_signout_menu = false

[auth.generic_oauth]
enabled = true
name = Auth0 by Okta
auto_login = true
allow_sign_up = true
use_pkce = true
scopes = openid profile email
login_attribute_path = email
name_attribute_path = name
email_attribute_path = email
role_attribute_path = "'Viewer'"
role_attribute_strict = true
auto_assign_org_role = Viewer

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/core-ingestion.json

[security]
allow_embedding = false

[log]
; TODO: Replace this with filters block per logger instead of global. Some of the loggers spam a lot of logs, especially during startup
level = warn
