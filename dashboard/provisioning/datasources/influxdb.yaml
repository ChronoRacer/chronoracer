apiVersion: 1

datasources:
  - name: InfluxDB Core
    uid: influxdb-core
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    editable: false
    jsonData:
      version: SQL
      dbName: ${INFLUX_DATABASE}
      httpMode: POST
      insecureGrpc: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
