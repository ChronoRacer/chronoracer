# Whole-VM host metrics only. The process scraper walks /proc and is omitted.
# CPU and memory panels read these host series.
# Logs: journald, filtered to this VM's service units. Syslog file collection stays off.
logging:
  receivers:
    journal:
      type: systemd_journald
  processors:
    only_chronoracer_units:
      type: exclude_logs
      match_any:
        - 'NOT jsonPayload._SYSTEMD_UNIT = "chronoracer-core.service" AND NOT jsonPayload._SYSTEMD_UNIT = "influxdb3.service"'
  service:
    pipelines:
      default_pipeline:
        receivers:
          - journal
        processors:
          - only_chronoracer_units
metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  processors:
    exclude_process_metrics:
      type: exclude_metrics
      metrics_pattern:
        - agent.googleapis.com/processes/.*
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
        processors:
          - exclude_process_metrics
