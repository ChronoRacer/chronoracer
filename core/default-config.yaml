runtime:
  rayon_threads: 4
  tokio_workers: 3
  # tokio_blocking is nearly unused, we can overlap with workers
  tokio_blocking: 1
  heartbeat_interval_s: 30
  data_pipeline_drain_timeout_s: 180
  notify_shutdown_on_failed_db_export: false
  notify_shutdown_on_failed_kafka_export: true
race:
  race_id: "placeholder"
  initial_driver_id: "placeholder"
kafka:
  brokers:
    - localhost:9092
  group_id: "chrono-core"
  sensor_data_consumer:
    fetch_min_bytes: 32768
    fetch_wait_max_ms: 25
    fetch_message_max_bytes: 5242880
    queued_min_messages: 200000
    queued_max_messages_kbytes: 262144
    socket_receive_buffer_bytes: 1048576
    auto_commit_interval_ms: 5000
  sensor_data_topic:
    name: "data"
    num_partitions: 4
    replication_factor: 1
  control_event_topic:
    name: "control"
    num_partitions: 1
    replication_factor: 1
  dlq_config:
    topic:
      name: "dlq"
      num_partitions: 3
      replication_factor: 1
    dlq_unknown_key: "unknown"
    publish_timeout_sec: 5
  heartbeat_topic:
    name: "heartbeat"
    num_partitions: 1
    replication_factor: 1
  export:
    redpanda_yaml_dir_path: "./redpanda"
    export_topics:
      - "dlq"
    nested_path_in_bucket: "export/kafka"
    local_path: "/export/kafka"
    max_retries: 2
processing:
  message_channel_buffer_size: 64
  message_batch_size: 1000
  message_batch_flush_interval_ms: 15
  dlq_channel_buffer_size: 10000
persistence:
  db_host: "http://localhost"
  db_port: 8181
  db_password: "apiv3_token"
  db_name: "chrono_db"
  fast_flush_max_combined_batch_size: 3000
  fast_flush_interval_ms: 2000
  fast_flush_sensor_ids:
    - "sensor-1"
    - "sensor-2"
  flush_max_combined_batch_size: 7000
  flush_interval_ms: 4000
  max_inflight_db_writes: 7
  export:
    compression_level: 6
    compression_type: ZSTD
    vm_export_dir: "/export/db"
    max_retries: 3
gcp:
  enabled: false
  export_bucket: "chronoracer-race"
  max_retries: 2
  max_gcs_concurrent_uploads: 3
  project_id: "chronoracer"
  pubsub_topic_id: "export-done"
telemetry:
  port: 9470
  max_queue_points: 16384
  max_queue_age_ms: 250
