runtime:
  rayon_threads: 4
  tokio_workers: 3
  # tokio_blocking is nearly unused, we can overlap with workers
  tokio_blocking: 1
  heartbeat_interval_s: 30
  heartbeat_write_failure_threshold_s: 60
  data_pipeline_drain_timeout_s: 180
  write_metrics_final_timeout_s: 15
  offset_final_commit_timeout_s: 15
  notify_shutdown_on_failed_db_export: false
  notify_shutdown_on_failed_kafka_export: true
race:
  race_id: "placeholder"
  initial_driver_id: "placeholder"
kafka:
  brokers:
    - localhost:9092
  group_id: "chrono-core"
  sensor_data_consumer:
    fetch_min_bytes: 1
    fetch_wait_max_ms: 100
    fetch_message_max_bytes: 5242880
    queued_min_messages: 200000
    queued_max_messages_kbytes: 262144
    socket_receive_buffer_bytes: 1048576
    auto_commit_interval_ms: 5000
    offset_lag_log_interval_s: 60
  sensor_data_topic:
    name: "data"
    num_partitions: 4
    replication_factor: 1
  control_event_topic:
    name: "control"
    num_partitions: 1
    replication_factor: 1
  dlq_config:
    topic:
      name: "dlq"
      num_partitions: 3
      replication_factor: 1
    dlq_unknown_key: "unknown"
    publish_timeout_sec: 5
    max_inflight_sends: 256
  heartbeat_topic:
    name: "heartbeat"
    num_partitions: 1
    replication_factor: 1
  export:
    redpanda_yaml_dir_path: "./redpanda"
    export_topics:
      - "dlq"
    nested_path_in_bucket: "export/kafka"
    local_path: "/export/kafka"
    max_retries: 2
    attempt_timeout_s: 300
processing:
  message_channel_buffer_size: 64
  message_batch_size: 1000
  message_batch_flush_interval_ms: 5
  dlq_channel_buffer_size: 1000
  dlq_sample_every: 100
persistence:
  db_host: "http://localhost"
  db_port: 8181
  db_password: "apiv3_token"
  db_name: "chrono_db"
  fast_flush_max_combined_batch_size: 3000
  fast_flush_interval_ms: 2000
  fast_flush_sensor_ids: []
  flush_max_combined_batch_size: 50000
  flush_interval_ms: 4000
  max_inflight_db_writes: 7
  write_retry_initial_backoff_ms: 200
  write_retry_max_backoff_ms: 10000
  export:
    compression_level: 6
    compression_type: ZSTD
    vm_export_dir: "/export/db"
    nested_path_in_bucket: "export/db"
    max_retries: 3
    attempt_timeout_s: 600
gcp:
  enabled: false
  export_bucket: "chronoracer-race"
  max_retries: 2
  max_gcs_concurrent_uploads: 3
  upload_timeout_s: 180
  pubsub_publish_timeout_s: 30
  project_id: "chronoracer"
  pubsub_topic_id: "export-done"
  allow_unknown_gce_metrics: true
telemetry:
  port: 9470
  max_queue_points: 16384
  max_queue_age_ms: 250
  max_subscribers: 4
