syntax = "proto3";

package chronoracer.telemetry.v1;

// One server stream. Behavioral rules live in docs/component-core.md.
service TelemetryService {
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message WatchRequest {
  string client_id = 1;
  oneof selection {
    AllSensors all = 2;
    SensorList sensors = 3;
  }
}

message AllSensors {}

message SensorList {
  repeated string sensor_ids = 1;
}

message WatchResponse {
  oneof payload {
    Hello hello = 1;
    PointBatch point_batch = 2;
    Gap gap = 3;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string race_id = 2;
  string stream_id = 3;
  uint64 next_sequence = 4;
  // Distinct sensors accepted for this call. 0 when the call selected all sensors.
  uint32 selected_sensor_count = 5;
}

message PointBatch {
  uint64 first_sequence = 1;
  repeated Point points = 2;
}

message Point {
  string sensor_id = 1;
  uint64 timestamp_nanos = 2;
  double value = 3;
  string driver_id = 4;
}

message Gap {
  uint64 first_sequence = 1;
  uint64 dropped_point_count = 2;
}
