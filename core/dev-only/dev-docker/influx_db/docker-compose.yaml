services:
  influxdb3-plugin-environment:
    image: influxdb:3-core
    user: root
    volumes:
      - influxdb3_plugin_venv:/plugin-venv
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        find /plugin-venv -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        /usr/lib/influxdb3/python/bin/python3 -m venv /plugin-venv
        /plugin-venv/bin/python -m pip install --no-cache-dir pyarrow
        /plugin-venv/bin/python -c 'import pyarrow'

  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3-core
    depends_on:
      influxdb3-plugin-environment:
        condition: service_completed_successfully
    env_file: [ influxdb3.env ]
    environment:
      VIRTUAL_ENV: /plugin-venv
    ports:
      - "8181:8181"
    volumes:
      - influxdb3_data:/var/lib/influxdb3
      - influxdb3_plugin_venv:/plugin-venv
      - ./admin-token.json:/etc/influxdb3/admin-token.json:ro
      - ../../../influxdb-plugins:/plugins
      - ../../../export/db:/export/db
    command: serve --node-id core --plugin-dir /plugins --disable-package-management --object-store file --data-dir /var/lib/influxdb3  --admin-token-file /etc/influxdb3/admin-token.json
    healthcheck:
      test: |
        TOKEN=$$(sed -n 's/.*"token": *\([^,}]*\).*/\1/p' /etc/influxdb3/admin-token.json | tr -d '" ')
        influxdb3 show databases --host "http://influxdb3:8181" --token "$$TOKEN" >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 7500M
        reservations:
          cpus: '1.0'
          memory: 4000M

  influxdb3-export-trigger:
    image: influxdb:3-core
    depends_on:
      influxdb3:
        condition: service_healthy
    env_file: [ influxdb3.env ]
    volumes:
      - ../../../influxdb-plugins:/plugins:ro
      - ./admin-token.json:/etc/influxdb3/admin-token.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        TOKEN=$$(sed -n 's/.*"token": *\([^,}]*\).*/\1/p' /etc/influxdb3/admin-token.json | tr -d '" ')
        
        echo "Checking if database 'chrono_db' exists..."
        if influxdb3 show databases --host http://influxdb3:8181 --token "$$TOKEN" 2>/dev/null | grep -q "chrono_db"; then
          echo "Database 'chrono_db' already exists."
        else
          echo "Creating database 'chrono_db'..."
          influxdb3 create database chrono_db \
            --host http://influxdb3:8181 \
            --token "$$TOKEN"
        fi
        
        if influxdb3 show database-triggers --host http://influxdb3:8181 --database chrono_db --token "$$TOKEN" 2>/dev/null | grep -q "database_export"; then
          echo "Trigger 'database_export' already exists."
        else
          echo "Registering 'database_export' trigger..."
          influxdb3 create trigger \
            --host http://influxdb3:8181 \
            --database chrono_db \
            --token "$$TOKEN" \
            --plugin-filename export_database.py \
            --trigger-spec "request:export_database" \
            database_export
        fi
        
        cleanup() {
          echo "Removing 'database_export' trigger..."
          influxdb3 delete trigger \
            --host http://influxdb3:8181 \
            --database chrono_db \
            --token "$$TOKEN" \
            --force \
            database_export
          echo "Trigger cleanup complete."
          exit 0
        }
        
        trap cleanup TERM INT
        
        echo "Setup complete"
        tail -f /dev/null & 
        wait $$!

volumes:
  influxdb3_data:
  influxdb3_plugin_venv:
