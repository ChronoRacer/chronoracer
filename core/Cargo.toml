[package]
name = "chronoracer-core"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
# TODO: if using any new compression codec, add it here and in build-core-binary.sh (snappy, lz4 are bundled by default)
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
apache-avro = "0.22.0"
config = { version = "0.15.25", features = ["yaml"] }
futures-util = "0.3.34"
rayon = { version = "1.12.0" }
influxdb3-client = { version = "0.3.0" } # TODO: always increment this to latest (lib is in early development)
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.151"
arc-swap = { version = "1.9.2" }
compact_str = { version = "0.10.0", features = ["serde"] }
async-trait = { version = "0.1.92" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
tracing-appender = { version = "0.2.5" }
which = "8.0.6"
google-cloud-storage = { version = "1.18.0" }
google-cloud-gax = { version = "1.14.0" }
google-cloud-pubsub = { version = "1.4.0" }
anyhow = { version = "1.0.104" }
ouroboros = "0.18.5"
