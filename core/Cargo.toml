[package]
name = "chronoracer-core"
version = "0.3.1"
edition = "2024"
build = "build.rs"

[lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "time", "signal", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
# TODO: if using any new compression codec, add it to rdkafka features and packages in build-core-binary.sh (snappy, lz4 are bundled by default)
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
config = { version = "0.15.26", features = ["yaml"] }
futures-util = "0.3.34"
rayon = { version = "1.12.0" }
# TODO: always increment influxdb3-client to latest (lib is in early development)
influxdb3-client = { version = "0.3.0" }
# Major version must match the arrow version influxdb3-client streams RecordBatches in
parquet = { version = "59", default-features = false, features = ["arrow", "async", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.151"
itoa = "1.0.18"
ryu = "1.0.23"
arc-swap = { version = "1.9.2" }
compact_str = { version = "0.10.0", features = ["serde"] }
async-trait = { version = "0.1.92" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
tracing-appender = { version = "0.2.5" }
which = "8.0.6"
google-cloud-storage = { version = "1.19.0" }
google-cloud-gax = { version = "1.15.0" }
google-cloud-pubsub = { version = "1.5.0" }
google-cloud-monitoring-v3 = { version = "1.13.0" }
google-cloud-api = { version = "1.7.0" }
google-cloud-wkt = { version = "1.8.0" }
anyhow = { version = "1.0.104" }
tonic = { version = "0.14.6", features = ["transport"] }
prost = "0.14.4"
tokio-stream = "0.1.19"
tonic-prost = "0.14.6"

[dev-dependencies]
# Oracle for the hand-written sensor data decoder (differential tests).
apache-avro = "0.22.0"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
