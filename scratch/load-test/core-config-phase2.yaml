# Phase-2 candidate overlay: baseline + Kafka fetch and batch-flush tuning for load tests.
# Same upload path as core-config.yaml; use one file per race (do not merge both).

kafka:
  sensor_data_consumer:
    offset_lag_log_interval_s: 10
    fetch_min_bytes: 1
    fetch_wait_max_ms: 100

processing:
  message_batch_flush_interval_ms: 5

race:
  initial_driver_id: loadtest
