# Host metrics every 60s; process scraper omitted.
# Journald ships only the three Analysis units (Loguru → stderr → journal → Cloud Logging).
logging:
  receivers:
    systemd_journald:
      type: systemd_journald
  processors:
    analysis_units_only:
      type: exclude_logs
      match_any:
        - >-
          NOT jsonPayload._SYSTEMD_UNIT = "chronoracer-analysis-stream.service"
          AND NOT jsonPayload._SYSTEMD_UNIT = "chronoracer-analysis-rules.service"
          AND NOT jsonPayload._SYSTEMD_UNIT = "chronoracer-analysis-predictions.service"
  service:
    pipelines:
      default_pipeline:
        receivers: [systemd_journald]
        processors: [analysis_units_only]
metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  processors:
    exclude_process_metrics:
      type: exclude_metrics
      metrics_pattern:
        - agent.googleapis.com/processes/.*
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
        processors:
          - exclude_process_metrics
