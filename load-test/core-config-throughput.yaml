# Baseline overlay + persistence sized for throughput (used from S3 on). Same upload path as core-config.yaml.
# InfluxDB acknowledges a write on its WAL flush (--wal-flush-interval 1s), so write_ms is ~0.5 s whatever the size:
# throughput per permit is batch size / WAL wait. 50,000 lines are ~3.9 MB (~78 B/line), under the 10 MB
# --max-http-request-size. Ceiling ~ 7 permits x 50,000 / 0.5 s ~ 700k lines/s.

kafka:
  sensor_data_consumer:
    offset_lag_log_interval_s: 10

persistence:
  flush_max_combined_batch_size: 50000

race:
  initial_driver_id: loadtest
