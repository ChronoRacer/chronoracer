[package]
name = "chronoracer-core"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"

[dependencies]
tokio = { version = "1.52.3", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
apache-avro = "0.22.0"
config = { version = "0.15.25", features = ["yaml"] }
futures-util = "0.3.32"
rayon = { version = "1.12.0" }
influxdb3-client = { version = "0.2.0" } # TODO: always increment this to latest (lib is in early development)
arc-swap = { version = "1.9.2" }
compact_str = { version = "0.10.0", features = ["serde"] }
async-trait = { version = "0.1.91" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
tracing-appender = { version = "0.2.5" }
which = "8.0.5"
google-cloud-storage = { version = "1.17.0" }
google-cloud-gax = { version = "1.13.0" }
google-cloud-pubsub = { version = "1.3.0" }
anyhow = { version = "1.0.104" }
