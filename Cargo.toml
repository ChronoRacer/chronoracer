[package]
name = "chronoracer-core"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"

[dependencies]
tokio = { version = "1.52.3", features = ["sync"] }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
apache-avro = "0.21.0"
config = { version = "0.15.25", features = ["yaml"] }
futures-util = "0.3.32"
thiserror = "2.0.18"
rayon = { version = "1.12.0" }